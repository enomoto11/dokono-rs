[package]
name = "dokono-cve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Vulnerability reachability analysis for Rust workspaces: decides whether a vulnerable function in a dependency is actually callable from your binaries."
readme = "README.md"

[[bin]]
name = "dokono-cve"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cargo_metadata = "0.18"
clap = { version = "4", features = ["derive"] }
dokono-core = { path = "../dokono-core", version = "0.5.0" }
lsp-types = "0.95"
proc-macro2 = { version = "1", features = ["span-locations"] }
rustsec = "0.32"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
insta = "1"
