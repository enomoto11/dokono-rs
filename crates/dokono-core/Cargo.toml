[package]
name = "dokono-core"
version = "0.4.0"
edition = "2024"
description = "Internal library for dokono-rs and sibling tools. Drives rust-analyzer over LSP to do symbol-level reachability analysis."
license = "MIT"
repository = "https://github.com/enomoto11/dokono-rs"
readme = "README.md"

[dependencies]
anyhow = "1"
async-lsp = { version = "0.2", default-features = false, features = ["omni-trait"] }
cargo_metadata = "0.18"
futures = "0.3"
gix = { version = "0.83.0", features = ["blocking-http-transport-reqwest-rust-tls"] }
lsp-types = "0.95"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "process", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower = "0.5"
tracing = "0.1"
url = "2"
