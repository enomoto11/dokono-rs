[package]
name = "dokono-core"
version = "0.4.0"
edition = "2024"
description = "Internal library for dokono-rs and sibling tools. Drives rust-analyzer over LSP to do symbol-level reachability analysis."
license = "MIT"
repository = "https://github.com/enomoto11/dokono-rs"
readme = "README.md"

[dependencies]
anyhow = "1"
cargo_metadata = "0.18"
gix = { version = "0.83.0", features = ["blocking-http-transport-reqwest-rust-tls"] }
