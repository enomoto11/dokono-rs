[package]
name = "dokono-test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Selective test runner for Rust workspaces. Runs only the tests affected by a code change, by driving rust-analyzer over LSP."
documentation = "https://github.com/enomoto11/dokono-rs"
readme = "README.md"
keywords = ["cli", "rust-analyzer", "lsp", "test-runner", "selective-testing"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = [
    "tests/fixtures",
]

[[bin]]
name = "dokono-test"
path = "src/main.rs"

[dependencies]
dokono-core = { path = "../dokono-core", version = "0.6.0" }
anyhow = "1"
cargo_metadata = "0.18"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
lsp-types = "0.95"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
