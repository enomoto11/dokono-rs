name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches every publishable crate version
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          META=$(cargo metadata --format-version 1 --no-deps)
          FAIL=0
          while read -r line; do
            name=${line%% *}
            version=${line##* }
            if [ "$TAG_VERSION" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match $name version $version"
              FAIL=1
            fi
          done < <(echo "$META" | jq -r '.packages[] | select(.publish == null or (.publish | length) > 0) | "\(.name) \(.version)"')
          [ $FAIL -eq 0 ] || exit 1
          echo "Tag and manifests match: $TAG_VERSION"

      - name: Verify every in-workspace dokono-core dep matches the tag
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FAIL=0
          while read -r line; do
            consumer=${line%% *}
            req=${line##* }
            if [ "$req" != "^$TAG_VERSION" ] && [ "$req" != "=$TAG_VERSION" ] && [ "$req" != "$TAG_VERSION" ]; then
              echo "::error::$consumer depends on dokono-core $req but tag is $TAG_VERSION"
              FAIL=1
            fi
          done < <(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | . as $p | .dependencies[] | select(.name == "dokono-core") | "\($p.name) \(.req)"')
          [ $FAIL -eq 0 ] || exit 1

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Publish dokono-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p dokono-core --locked

      - name: Wait for dokono-core to be available on crates.io index
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if cargo search dokono-core --limit 1 | grep -q "^dokono-core = \"$TAG_VERSION\""; then
              echo "dokono-core $TAG_VERSION is indexed"
              exit 0
            fi
            echo "waiting for index propagation ($i/30)..."
            sleep 10
          done
          echo "::error::dokono-core $TAG_VERSION did not appear in the index after 5 min"
          exit 1

      - name: Publish remaining crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          PKGS=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name != "dokono-core") | select(.publish == null or (.publish | length) > 0) | .name')
          for pkg in $PKGS; do
            echo ">>> publishing $pkg"
            cargo publish -p "$pkg" --locked
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
